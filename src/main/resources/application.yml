# Cấu hình chung cho mọi môi trường (mặc định = production-safe).
# Profile: dev (application-dev.yml), test (application-test.yml). Giá trị nhạy cảm luôn lấy từ biến môi trường.
spring:
  application:
    name: social-analytics
  config:
    # Đọc biến môi trường từ file .env ở thư mục gốc (không commit) — xem .env.example
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:33069}/${DB_NAME:social_analytics}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Giới hạn upload (import Excel — OWASP A06). Quá giới hạn → 413
      max-file-size: 5MB
      max-request-size: 6MB
      # Parse multipart khi controller đọc tham số → lỗi quá dung lượng do ApiExceptionHandler xử lý (ProblemDetail)
      resolve-lazily: true

  mvc:
    async:
      # Request async (StreamingResponseBody của /api/export-report): tính cả lúc dựng file lẫn lúc client tải về.
      # Mặc định 30s của Tomcat cắt ngang khi tải báo cáo lớn (gần app.export.max-rows) qua mạng chậm → file .xlsx hỏng.
      # Không đặt quá dài: mỗi lượt tải chậm giữ 1 thread của executor async trong suốt thời gian này.
      # Cơ sở chọn 60s (đo 10.000 dòng = app.export.max-rows; SXSSF dựng xong file rồi mới ghi → thời gian = dựng + tải):
      #   - Dữ liệu thực tế (content ~200 ký tự): file ~0,5 MB, dựng ~6s, tải ~4s ở 1 Mbps → dư nhiều.
      #   - Xấu nhất (mọi cột chạm giới hạn validate, content 5000 ký tự): ~45 MB, dựng ~29s → cần mạng > ~10 Mbps.
      #     Chấp nhận không phủ trường hợp này (lớn hơn dữ liệu thực tế ~80 lần); nếu cần thì giảm app.export.max-rows
      #     thay vì kéo timeout lên vài phút.
      request-timeout: 60s

  security:
    oauth2:
      client:
        registration:
          # Facebook có sẵn trong CommonOAuth2Provider (authorization/token/user-info URI, user-name-attribute=id).
          # Redirect URI mặc định {baseUrl}/login/oauth2/code/facebook — phải khai báo y hệt trên Facebook Developers.
          # Bắt buộc: thiếu biến môi trường thì app dừng khởi động. Không commit secret (OWASP A02/A04).
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            # Quyền tối thiểu để đăng nhập (OWASP A01 — least privilege)
            scope: public_profile,email
          # X (Twitter) không có trong CommonOAuth2Provider → khai báo thủ công (OAuth 2.0 Authorization Code + PKCE).
          # Redirect URI: {baseUrl}/login/oauth2/code/twitter — khai báo y hệt ở X Developer Portal (Callback URI).
          # App trên X phải là loại confidential ("Web App, Automated App or Bot") → client secret gửi qua HTTP Basic.
          twitter:
            provider: twitter
            client-name: X
            client-id: ${TWITTER_CLIENT_ID}
            client-secret: ${TWITTER_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # GET /2/users/me cần cả users.read và tweet.read
            scope: users.read,tweet.read
        provider:
          twitter:
            authorization-uri: https://x.com/i/oauth2/authorize
            token-uri: https://api.x.com/2/oauth2/token
            user-info-uri: https://api.x.com/2/users/me
            # Response {"data": {"id", "name", "username"}} — CustomOAuth2UserService bóc "data" trước khi đọc "id"
            user-name-attribute: id

  task:
    execution:
      # Khai báo socialCrawlerExecutor (AsyncConfig) làm Boot bỏ applicationTaskExecutor mặc định → "force" để giữ nó
      # cho @Async không ghi tên executor và các tác vụ async khác của Spring
      mode: force
    scheduling:
      thread-name-prefix: scheduler-

  artemis:
    # native = kết nối broker Artemis riêng (production, docker compose). Dev/test dùng embedded (broker trong JVM,
    # không mở cổng mạng) — xem application-dev.yml / application-test.yml
    mode: native
    # Timeout (OWASP A10) để broker chậm/không phản hồi không giữ thread vô thời hạn (vd thread request lúc publish):
    #   connectTimeoutMillis: mở kết nối TCP; callTimeout: chờ broker xác nhận 1 lệnh (gửi message persistent, commit...)
    broker-url: tcp://${ARTEMIS_HOST:localhost}:${ARTEMIS_PORT:61616}?connectTimeoutMillis=5000&callTimeout=10000
    user: ${ARTEMIS_USER}
    password: ${ARTEMIS_PASSWORD}

  jms:
    listener:
      session:
        # Listener ném exception → rollback session → broker giao lại message (retry + DLQ cấu hình trên broker)
        transacted: true
      # Số consumer song song mỗi @JmsListener (listener phải idempotent — có thể nhận lại message)
      min-concurrency: 1
      max-concurrency: 3

  data:
    web:
      pageable:
        # Giới hạn size của tham số Pageable — vượt thì bị hạ xuống giá trị này (OWASP A06). Size mặc định 20 của Boot.
        max-page-size: 100

server:
  # Chạy sau reverse proxy / load balancer kết thúc HTTPS: đặt FORWARD_HEADERS_STRATEGY=native để scheme/host
  # (link Location, cờ Secure của cookie) lấy từ X-Forwarded-*. Để trống khi không có proxy tin cậy đứng trước —
  # nếu bật, client có thể giả header này. Trống = Boot tự nhận diện nền tảng (vd Kubernetes → native).
  # Tomcat chỉ tin X-Forwarded-* từ proxy có IP nội bộ (10/8, 172.16/12, 192.168/16, 127/8...); proxy IP khác thì
  # khai thêm server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:}
  servlet:
    session:
      timeout: 30m
      # Cookie session (OWASP A02): JS không đọc được, không gửi kèm request cross-site dạng POST
      cookie:
        http-only: true
        same-site: lax
        # Chỉ gửi qua HTTPS — mặc định bật (production); dev/test chạy HTTP localhost thì tắt
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    # Không trả chi tiết lỗi nội bộ ra client (OWASP A02/A10)
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# Swagger / OpenAPI tắt mặc định (không public ở production — OWASP A01), chỉ bật ở profile dev
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # Swagger UI đọc cookie XSRF-TOKEN và gửi header X-XSRF-TOKEN cho POST/PUT/DELETE
    csrf:
      enabled: true

logging:
  file:
    # Thư mục log file (logback-spring.xml), mỗi ngày 1 file
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    com.huuhv.socialanalytics: INFO

# Cấu hình riêng của ứng dụng — bind vào com.huuhv.socialanalytics.config.properties.AppProperties
# (giới hạn phân trang dùng spring.data.web.pageable.* của Boot ở trên, không khai trong app.*)
app:
  import:
    # Số dòng dữ liệu tối đa mỗi file import Excel
    max-rows: 1000
    # Tổng dung lượng sau giải nén của file .xlsx — chặn file nén cao (zip bomb) làm tràn heap
    max-uncompressed-size: 20MB
  export:
    # Số dòng tối đa mỗi báo cáo export Excel — vượt thì trả 400
    max-rows: 10000
    # Khoảng cách tối thiểu giữa 2 lần export của cùng 1 user — gọi sớm hơn trả 429 (0 = tắt)
    min-interval: 10s
  token-encryption:
    # Key AES-256 (Base64 của 32 byte) mã hoá access token lưu DB — bắt buộc, sinh bằng: openssl rand -base64 32
    # Thiếu/sai định dạng → app dừng khởi động. Đổi key → token cũ không giải mã được, user phải đăng nhập lại.
    key: ${TOKEN_ENCRYPTION_KEY:}
  oauth2:
    # Timeout gọi Facebook / X trong login callback (đổi code lấy token, user info) — provider treo không giữ thread
    # Tomcat vô thời hạn; hết giờ → /login?error. Phải > 0
    connect-timeout: 5s
    read-timeout: 10s
  async:
    # Thread pool socialCrawlerExecutor (AsyncConfig) crawl metrics song song theo tài khoản.
    # Đủ max-pool-size thread và queue đầy → thread gửi chờ tới khi queue có chỗ (WaitForQueueSpacePolicy), không bị bỏ.
    social-crawler:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
      # Tắt app: chờ task đang chạy tối đa khoảng này
      await-termination: 30s
  jobs:
    update-metrics:
      # Crawl metrics mọi tài khoản (UpdateSocialMetricsJob). Cron Spring 6 trường: giây phút giờ ngày tháng thứ.
      # Mặc định đầu mỗi giờ; "-" = tắt job
      cron: "0 0 * * * *"
      # Số bài mỗi lần gọi API mạng xã hội (tối đa 100)
      batch-size: 100
      # Thời lượng tối đa 1 lần chạy, tính từ lúc bắt đầu (gồm cả lúc gửi task). Quá hạn: tài khoản chưa xong tính lỗi,
      # task còn chạy bỏ kết quả. Phải nhỏ hơn chu kỳ cron — đổi cron thì đổi cả timeout (xem application-dev.yml)
      timeout: 50m
