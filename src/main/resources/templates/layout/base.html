<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CSRF token cho fetch/upload bằng JS (static/js/csrf.js) -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <!-- Tên cookie chứa token raw hiện tại (WebSocket kết nối lại sau khi cookie đổi) -->
    <meta name="_csrf_cookie" th:content="${csrfCookieName}">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Social Analytics</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Social Analytics</a>
        <div class="ms-auto d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
            <span class="navbar-text" th:text="${displayName}">user</span>
            <!-- Logout chỉ nhận POST; th:action tự chèn hidden _csrf -->
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4" layout:fragment="content"></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/js/csrf.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
