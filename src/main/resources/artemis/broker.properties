# Cấu hình broker Artemis (cú pháp "broker properties") — NGUỒN DUY NHẤT cho cả 2 loại broker:
#   - Broker riêng của docker compose: file này được mount vào container, nạp mỗi lần khởi động qua
#     `artemis run --properties` (xem service artemis trong docker-compose.yaml) — áp dụng cả khi volume artemis-data
#     đã có instance cũ (etc-override của image chỉ copy lúc tạo instance lần đầu).
#   - Broker embedded (dev/test): config/ArtemisEmbeddedConfig nạp từ classpath (app.jms.embedded-broker-properties).
# Khoá sai chính tả: broker riêng chỉ bỏ qua lặng lẽ, broker embedded làm app không khởi động —
# ArtemisEmbeddedConfigTest nạp chính file này nên sửa file phải chạy test đó.
# Không chứa secret (tài khoản broker lấy từ ARTEMIS_USER / ARTEMIS_PASSWORD).
#
# Retry + DLQ cho queue import-completed (QueueNames.IMPORT_COMPLETED / IMPORT_COMPLETED_DLQ):
#   - Listener ném exception → rollback → broker giao lại sau redeliveryDelay ms (nhân redeliveryMultiplier mỗi lần,
#     tối đa maxRedeliveryDelay ms).
#   - Giao đủ maxDeliveryAttempts lần (gồm lần đầu) vẫn lỗi → chuyển sang DLQ.import-completed
#     (ImportCompletedDlqListener). Các thuộc tính khác kế thừa address setting "#".
#   - 6 lần giao, chờ 2s, 4s, 8s, 16s, 30s giữa các lần → chịu được ~1 phút lỗi tạm thời (MySQL failover/restart,
#     deadlock) trước khi vào DLQ. Tăng/giảm số lần thì giữ tổng thời gian chờ có ý nghĩa với maxRedeliveryDelay.
addressSettings."import-completed".maxDeliveryAttempts=6
addressSettings."import-completed".redeliveryDelay=2000
addressSettings."import-completed".redeliveryMultiplier=2.0
addressSettings."import-completed".maxRedeliveryDelay=30000
addressSettings."import-completed".deadLetterAddress=DLQ.import-completed

# Chính DLQ.import-completed: ImportCompletedDlqListener chỉ ném exception khi lỗi DB lúc đánh dấu DEAD_LETTERED
# (payload hỏng chỉ log, không ném) → giao lại VÔ HẠN (-1), giãn dần 5s → tối đa 5 phút, tới khi DB hoạt động lại.
# Không đặt thì kế thừa "#" (delay 0, 10 lần) → hết 10 lần trong vài ms rồi sang queue DLQ chung không có listener,
# import kẹt ở PENDING.
addressSettings."DLQ.import-completed".maxDeliveryAttempts=-1
addressSettings."DLQ.import-completed".redeliveryDelay=5000
addressSettings."DLQ.import-completed".redeliveryMultiplier=2.0
addressSettings."DLQ.import-completed".maxRedeliveryDelay=300000

# Tạo sẵn queue DLQ (anycast): message chuyển tới address không có queue nào sẽ bị bỏ
addressConfigurations."DLQ.import-completed".routingTypes=ANYCAST
addressConfigurations."DLQ.import-completed".queueConfigs."DLQ.import-completed".routingType=ANYCAST
addressConfigurations."DLQ.import-completed".queueConfigs."DLQ.import-completed".address=DLQ.import-completed
